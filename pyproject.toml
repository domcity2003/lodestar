[project]
name = "rescue-wing"
version = "0.1.0"
description = "Design study: a long-endurance flying-wing search-and-rescue drone with a thermal camera and a parachute rescue-kit drop. Virtual only, free tools, public data."
requires-python = ">=3.13,<3.14"
dependencies = [
    "aerosandbox>=4.2.10",   # aircraft sizing and optimization (MIT, Peter Sharpe)
    "neuralfoil>=0.3.3",     # fast airfoil analysis, comes with AeroSandbox
    "jsbsim>=1.3.3",         # flight dynamics simulator (used by flight sims and ArduPilot)
    "build123d>=0.13.0",     # CAD written in Python, exports STEP/STL
    "numpy",
    "scipy",
    "matplotlib",
    "pandas",
    "jupyterlab",
    "openmdao>=3.45.2",      # NASA's multidisciplinary optimization framework
    "plotly>=7.1.0",         # interactive charts
    "pyvista>=0.49.2",       # 3D viewing of meshes and results
]

[tool.uv]
package = false

